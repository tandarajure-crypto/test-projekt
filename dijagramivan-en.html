dCodes":[]},{"code":"3.1.1.2.3-S2","name":"Marijan Ivanov","qualifier":"1914.–1916.","father":"Ivan Križanov","fatherCode":"","mother":"Ruža Serdarušić","spouses":[],"spouseCodes":[],"relation":"sin","note":"Osoba je evidentirana u proširenom obiteljskom zapisu.","kind":"virtual","hostCode":"3.1.1.2.3","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"podatak nije dostupan","years":["1914","1916"],"parentCodes":["3.1.1.2.3-SP-1","3.1.1.2.3"],"childCodes":[]},{"code":"3.1.1.2.4","name":"Jure Križanov (★ 1883 – ✝ 1947) – family nickname ĐULKO","qualifier":"","father":"Križan, son of Lovro","fatherCode":"","mother":"Pera Budimir","spouses":["Pera Matišić","unknown given name, née Budić","Joza née Dragun"],"spouseCodes":["3.1.1.2.4-SP-1","3.1.1.2.4-SP-2","3.1.1.2.4-SP-3"],"relation":"surname holder in the diagram","note":"He was the ninth son of Križan Lovrin and married three times—the highest number of marriages recorded among the Tandaras.\n\nHis first wife was Pera Matišić, who came from the family of the renowned Croatian musical family Matišić. They had a son, Josip. Pera died in 1919 during the Spanish flu epidemic, which local people called ‘grla’. His second marriage was to a woman from the Budić family. They had a son, Martin, who was killed near Bihać in 1942. His third marriage was to Joza Dragun, and they had no children.","kind":"node","hostCode":"3.1.1.2.4","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1919","1942"],"parentCodes":["3.1.1.2","3.1.1.2-SP-1"],"childCodes":["3.1.1.2.4.1","3.1.1.2.4-S1"]},{"code":"3.1.1.2.4.1","name":"Josip Jurin","qualifier":"★ 1911 – ✝ 1946","father":"Jure, son of Križan – nickname Đulko","fatherCode":"","mother":"Pera Matišić","spouses":["Anica Dragun"],"spouseCodes":["3.1.1.2.4.1-SP-1"],"relation":"surname holder in the diagram","note":"Genealogical Note on Josip and the Family Tragedy\n\nJosip was married to Anica, née Dragun, with whom he had two sons, Ivan and Milan, and four daughters, Slava (1935–1977), Mara (1936–2012), Neda (1939–2025) and Matija (1940–). The family lived in Zavelim, where Josip was known as a hardworking and honest man who was deeply attached to his home region and community.\n\nIn 1946, Josip tragically lost his life in circumstances that remained shrouded in secrecy for decades. He was killed above the cooperative building in Zavelim. According to testimony uncovered later, the crime was carried out by the brother of their immediate neighbour, while the neighbour himself organised the crime and acted for personal gain.\n\nIt should also be noted that, after this tragic event, the organiser of the crime helped Josip's family in various ways, probably in an attempt to atone for what he had done. Because my late father Ivan personally received this help, until his death he could not accept that his immediate neighbour had organised the murder of his father—my grandfather Josip—nor could he believe the eyewitness account of the event.\n\nAfter the war, a story spread that Josip had been killed by retreating ‘kamišari’, and during the period of the former state he was portrayed as a victim of the Ustaše. A memorial was erected to him in the village on the basis of that account, while his wife Anica never received the compensation to which she was entitled.\n\nOnly a little more than thirty years later, shortly before his death, did an eyewitness reveal the true circumstances of the event and the identity of the perpetrator. According to his testimony, the man who carried out the killing died in Germany in 1963, while the organiser died in 1990 after a long and serious illness.\n\nDespite everything, no investigation was ever opened and no judicial proceedings were conducted, so this tragedy remained without legal consequences.\n\nIt is important to emphasise that the present generations of both families live in entirely different times and circumstances. There is no ill will between our family and the descendants of those involved in the crime. On the contrary, we maintain good and friendly relations, free from the burden of the past and from any sense of guilt or responsibility for the actions of our long-deceased ancestors.\n\nThis account is included solely as a historical note within the family genealogy, with respect for the truth and for all living members and descendants of the family lines concerned.","kind":"node","hostCode":"3.1.1.2.4.1","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1911","1946"],"parentCodes":["3.1.1.2.4-SP-1","3.1.1.2.4"],"childCodes":["3.1.1.2.4.1.1","3.1.1.2.4.1.2","3.1.1.2.4.1-S1","3.1.1.2.4.1-K1","3.1.1.2.4.1-K2","3.1.1.2.4.1-K3","3.1.1.2.4.1-K4","3.1.1.2.4.1-K5"]},{"code":"3.1.1.2.4.1.1","name":"Ivan Josipov","qualifier":"★ 1933 – ✝ 2025","father":"Josip, son of Jure","fatherCode":"","mother":"Anica Dragun","spouses":["Matija Pušić"],"spouseCodes":["3.1.1.2.4.1.1-SP-1"],"relation":"surname holder in the diagram","note":"He married twice. From his first marriage, to Matija Pušić, he had two sons, Jure and Vladimir, and a daughter, Mihaela (baptised as Milena). His second marriage, to Verka Nikolovski, produced no children. The family lives in Zagreb.","kind":"node","hostCode":"3.1.1.2.4.1.1","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1933","2025"],"parentCodes":["3.1.1.2.4.1","3.1.1.2.4.1-SP-1"],"childCodes":["3.1.1.2.4.1.1.1","3.1.1.2.4.1.1.2","3.1.1.2.4.1.1-K1"]},{"code":"3.1.1.2.4.1.1.1","name":"Jure Ivanov","qualifier":"★ 1956 – ✝ unknown","father":"Ivan, son of Josip","fatherCode":"","mother":"Matija Pušić","spouses":["Ruža Kosić"],"spouseCodes":["3.1.1.2.4.1.1.1-SP-1"],"relation":"surname holder in the diagram","note":"Jure and Ruža Kosić had two sons, Ivica Julio and Marin Tin. The family lives in Zagreb.","kind":"node","hostCode":"3.1.1.2.4.1.1.1","branch":"Antina grana","source":"box3e.h
