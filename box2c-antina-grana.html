prema naknadno otkrivenim svjedočenjima, zločin je počinio brat njihova prvog susjeda, koji je bio organizator zločina i djelovao iz osobne koristi.\n\nTakođer treba istaknuti da je organizator zločina nakon toga tragičnog događaja na različite načine pomagao Josipovoj obitelji, vjerojatno pokušavajući iskupiti se za počinjeno nedjelo. Budući da je moj pokojni otac Ivan osobno primao njegovu pomoć, sve do svoje smrti nije mogao prihvatiti činjenicu da je upravo njegov prvi susjed organizirao ubojstvo njegova oca, mojega djeda Josipa, niti je mogao povjerovati svjedočenju očevica toga događaja.\n\nNakon rata proširila se priča da su Josipa ubili kamišari u povlačenju, pa je u razdoblju bivše države bio prikazivan kao žrtva ustaša. Na temelju te verzije podignut mu je i spomenik u mjestu, dok njegova supruga Anica nikada nije ostvarila pripadajuću odštetu.\n\nTek nešto više od trideset godina poslije očevidac je, neposredno prije svoje smrti, otkrio stvarne okolnosti događaja i identitet počinitelja. Prema njegovu svjedočenju, izvršitelj ubojstva poginuo je 1963. godine u Njemačkoj, dok je organizator preminuo 1990. godine nakon duge i teške bolesti.\n\nUnatoč svemu, nikada nije pokrenuta istraga niti je provedeno sudsko procesuiranje, pa je ova tragedija ostala bez pravnih sankcija.\n\nVažno je istaknuti da današnje generacije obiju obitelji žive u potpuno drukčijem vremenu i okolnostima. Između naše obitelji i potomaka počinitelja zločina nema nikakve zle krvi. Naprotiv, njegujemo dobre i prijateljske odnose, bez tereta prošlosti te bez osjećaja krivnje ili odgovornosti za postupke naših davno preminulih predaka.\n\nOvaj zapis služi isključivo kao povijesna bilješka u rodoslovlju, uz poštovanje prema istini te prema svim osobama i nasljednicima obiteljskih loza koji danas žive.","kind":"node","hostCode":"3.1.1.2.4.1","branch":"Antina grana","source":"box3e.html","inferred":[],"maritalStatus":"oženjen/udana","years":["1911","1946"],"parentCodes":["3.1.1.2.4-SP-1","3.
