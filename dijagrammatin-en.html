<script>
const DATA={"code":"4.0","label":"Mate Tandara – son of Ivan (born c. 1740)","detail":"Mate, the youngest son of the first ancestor Ivan, and his wife Filipa, née Kopač, had a son Ivan and daughters Matija (–1845), Manda (1790–), Jaka (1793–) and Cecilija, whose dates are unavailable. Ivan was the only son and surname successor.","children":[{"code":"4.1","label":"Ivan, son of Mate (–1870)","detail":"Ivan, son of Mate, married twice. He first married Pava Sičenica in 1817, and they had a son, Ante. In his second marriage to Jela Parlov, he had a daughter, Ruža (1849–).","children":[{"code":"4.1.1","label":"Ante, son of Ivan (1832–)","detail":"Ante married Joza Pušić in 1853. They had sons Ivan, Jure (1858–), Marko (1865–) and Mate, and daughters Iva (1862–), Tomica (1867–1869), Mara (1870–) and Jela (1877–). No records concerning Jure and Marko have been found apart from their birth records. They may have died young or moved elsewhere.","children":[{"code":"4.1.1.1","label":"Ivan, son of Ante (1855–1928)","detail":"He married Ruža Matišić, and they had sons Marijan (1888–), Jozo and Ivan, and daughters Anica (1893–1920), Iva (1895–) and Jela (1899–). No records concerning Marijan have been found apart from his birth record. He may have died young or moved elsewhere.","children":[{"code":"4.1.1.1.1","label":"Jozo, son of Ivan (1890–1947)","detail":"Jozo, Ivan’s second son, married Iva Bilić. They had sons Marijan and Mirko (1932–1936), who died as a young child, and daughters Joza (1922–) and Ana (1926–).","children":[{"code":"4.1.1.1.1.1","label":"Marijan, son of Jozo (1929–1977)","detail":"Marijan married Matija Mršić, and they had a son, Josip, and daughters Nada (1953–), Danica (1954–), Branka (1958–), Ana (1960–), Dragica (1964–) and Mirjana (1975–). Josip married Dragica Pavić. They have sons Marijan, Ante and Kristijan, and a daughter, Silvija.","children":[{"code":"4.1.1.1.1.1.1","label":"Josip, son of Marijan (1962–)","detail":"Josip married Dragica Pavić. They have sons Marijan (1991–), Ante (1996–) and Kristijan (1998–), and a daughter, Silvija (1994–). The family lives in Ričice.","children":[]}]}]},{"code":"4.1.1.1.2","label":"Ivan, son of Ivan (1903–1965)","detail":"He married twice. His first wife was Jaka Tavra, with whom he had sons Frane and Stanko (1938–1952), who died at the age of fourteen. He had no children in his second marriage to Ana Capia.","children":[{"code":"4.1.1.1.2.1","label":"Frane, son of Ivan (1933–)","detail":"Frane married Tomica Pavić, and they had sons Stanko, Cvjetko (1957–), Miroslav (1959–1959), who died as a young child, and Dragomir (1963–), and daughters Marija (1953–), Roza (1955–), Miroslava (1960–) and Anita (1971–). Stanko is married to Ankica Kovačević. They have daughters Tatjana and Tamara and live in Zagreb. Cvjetko and Dragomir never married. They live in Klokočevac near Bjelovar.","children":[{"code":"4.1.1.1.2.1.1","label":"Stanko, son of Frane (1956–)","detail":"Stanko married Ankica Kovačević, and they had daughters Tatjana (1981–) and Tamara (1983–). The family lives in Zagreb.","children":[]}]}]}]},{"code":"4.1.1.2","label":"Mate, son of Ante (1873–1927)","detail":"He married Ruža Manenica. They had sons Ante (1901–1901), Josip (1905–), Cvitan, another son also named Ante (1908–), and Nikola, and daughters Tomica (1902–) and Mara (1910–). No records concerning Josip have been found apart from his birth record. He may have died young or moved elsewhere.","children":[{"code":"4.1.1.2.1","label":"Cvitan, son of Mate (★ 1906 – ✝ 1981)","detail":"Cvitan, Mate’s third son, married Tomica Pavić. They had sons Mate (1932–1933), who died as a young child, and Nikola (1938–), and daughters Lucija (1930–), Ana (1934–1935), Ruža (1936–), Stana (1940–), Nevenka (1945–) and Branka (1947–). No records concerning Nikola have been found apart from his birth record. He may have died young or moved elsewhere. Cvitan’s line died out.","children":[]},{"code":"4.1.1.2.2","label":"Ante, son of Mate (1908–)","detail":"He married Ana Pavić. They had sons Marijan, Dinko (1937–1939), who died as a young child, Mirko, Mate and Cvitan, and daughters Ana (1935–), Mara (1939–) and Tonka (1950–).","children":[{"code":"4.1.1.2.2.1","label":"Marijan, son of Ante (1934–1963)","detail":"Marijan married Pava Pušić. They raised sons Ante and Dinko, and a daughter, Neda (1960–). Marijan was killed in Germany in 1963. The family lives in Klokočevac.","children":[{"code":"4.1.1.2.2.1.1","label":"Ante, son of Marijan (1961–1991)","detail":"Ante married Mirjana Čeh, and they had sons Marijan (1988–) and Marko (1990–). In the early 1990s, he joined the defence of Croatia against the aggression of the former Yugoslav People’s Army and Serbian paramilitary forces.\n\nHe served in the Croatian War of Independence from August 1991 as a member of the 105th Brigade of the Croatian Army. In September of that year, Ante and nineteen other Croatian defenders, mostly from Bjelovar, were captured in Kusonje near Pakrac, tortured and killed. Their remains were exhumed from the Rakov Potok mass grave in January 1992.","children":[]},{"code":"4.1.1.2.2.1.2","label":"Dinko, son of Marijan (1963–)","detail":"Dinko married Dubravka Lončar, and they had sons Luka (1987–) and Pavao (1988–). Dinko served as an assistant minister under Tomislav Medved. The family lives in Zagreb.","children":[]}]},{"code":"4.1.1.2.2.2","label":"Mirko, son of Ante (1942–)","detail":"He married Anđa Parlov, and they had sons Marijan (1965–) and Ivica. Marijan never married. Mirko, Anđa and Marijan live in Split.","children":[{"code":"4.1.1.2.2.2.1","label":"Ivica, son of Mirko (1969–)","detail":"Ivica married Matija Bilobrk. They have a son, Ivan (1992–), and a daughter, Ivana (1985–). They live in the United States.","children":[]}]},{"code":"4.1.1.2.2.3","label":"Cvitan, son of Ante (1945–)","detail":"He married Katica Kršinić. They have a son, Marijan, and a daughter, Zrinka (1973–). Cvitan’s family lives in Split.","children":[{"code":"4.1.1.2.2.3.1","label":"Marijan, son of Cvitan (★ 1970)","detail":"Marijan married Leida Kezele. They have sons Luka (1996–) and Lovro (1999–). The family lives in Split.","children":[]}]},{"code":"4.1.1.2.2.4","label":"Mate, son of Ante (1947–)","detail":"He married Zlata Mihoci. They raised a son, Dario, and a daughter, Danijela (1977–). The family lives in Split.","children":[{"code":"4.1.1.2.2.4.1","label":"Dario, son of Mate (1973–)","detail":"Dario is married to Ivana, née Tomić. They have six children; names, sexes and birth years will be added later.","children":[]}]}]},{"code":"4.1.1.2.3","label":"Nikola, son of Mate (1911–1980)","detail":"Nikola married Mara Brnas. They had sons Vinko and Ante and daughters Dragica, Tomica and Nediljka. Ante did not marry. The family lives in Ričice.","children":[{"code":"4.1.1.2.3.1","label":"Vinko, son of Nikola (★ 1947. – ✝ 2010.)","detail":"Vinko was married to Daniela Zaizer, with whom he had a son, Nikola David (1981–). No information is available as to whether Nikola David married or remained single.","children":[]}]}]}]}]}]};

function buildPersonText(person,node=null){const lines=[];if(person.relation)lines.push("Relationship: "+person.relation+".");if(person.born||person.died)lines.push("Years: "+(person.born?("★ "+person.born):"★ unknown")+" – "+(person.died?("✝ "+person.died):"✝ unknown")+".");if(person.father)lines.push("Father: "+person.father+".");if(person.mother)lines.push("Mother: "+person.mother+".");if(person.spouses&&person.spouses.length)lines.push((person.spouses.length>1?"Spouses: ":"Spouse: ")+person.spouses.join(", ")+".");if(person.status)lines.push("Status: "+person.status+".");const note=String(person.note||"").trim();if(note)lines.push(note);const detail=node&&node.detail?String(node.detail).trim():"";const canonical=value=>String(value||"").toLocaleLowerCase("en").replace(/\s+/g," ").trim();if(detail&&canonical(detail)!==canonical(note))lines.push(detail);return lines.join("\n")||UI.noDetails;}

function scorePerson(person,q,tokens){const names=directNames(person),allTokens=new Set(searchableText(person).split(/\s+/).filter(Boolean)),code=normalizeText(person.id),nameTokens=new Set(names.join(" ").split(/\s+/).filter(Boolean));if(code===q)return 1000;if(!tokens.every(token=>allTokens.has(token)))return -1;const alphaTokens=tokens.filter(token=>/[a-z]/.test(token));if(alphaTokens.length&&!alphaTokens.some(token=>nameTokens.has(token)))return -1;let score=0;if(names.includes(q))score+=900;if(names.some(name=>name.startsWith(q)))score+=500;score+=tokens.filter(token=>nameTokens.has(token)).length*80;const yearTokens=new Set(normalizeText(person.born+" "+person.died).split(/\s+/).filter(Boolean));score+=tokens.filter(token=>yearTokens.has(token)).length*35;return score;}

de":"","mother":"Jela Parlov","spouses":[],"spouseCodes":[],"relation":"kći Ivana Matina i Jele Parlov","note":"","kind":"virtual","hostCode":"4.1","branch":"Matina grana – brak s Jelom Parlov","source":"box3h.html","inferred":[],"maritalStatus":"podatak nije dostupan","years":["1849"],"parentCodes":["4.1-SP-2","4.1"],"childCodes":[]}],"tree":{"code":"4.0","label":"Mate Tandara – son of Ivan (born c. 1740)","detail":"Mate, the youngest son of the first ancestor Ivan, and his wife Filipa, née Kopač, had a son Ivan and daughters Matija (–1845), Manda (1790–), Jaka (1793–) and Cecilija, whose dates are unavailable. Ivan was the only son and surname successor.","children":[{"code":"4.1","label":"Ivan, son of Mate (–1870)","detail":"Ivan, son of Mate, married twice. He first married Pava Sičenica in 1817, and they had a son, Ante. In his second marriage to Jela Parlov, he had a daughter, Ruža (1849–).","children":[{"code":"4.1.1","label":"Ante, son of Ivan (1832–)","detail":"Ante married Joza Pušić in 1853. They had sons Ivan, Jure (1858–), Marko (1865–) and Mate, and daughters Iva (1862–), Tomica (1867–1869), Mara (1870–) and Jela (1877–). No records concerning Jure and Marko have been found apart from their birth records. They may have died young or moved elsewhere.","children":[{"code":"4.1.1.1","label":"Ivan, son of Ante (1855–1928)","detail":"He married Ruža Matišić, and they had sons Marijan (1888–), Jozo and Ivan, and daughters Anica (1893–1920), Iva (1895–) and Jela (1899–). No records concerning Marijan have been found apart from his birth record. He may have died young or moved elsewhere.","children":[{"code":"4.1.1.1.1","label":"Jozo, son of Ivan (1890–1947)","detail":"Jozo, Ivan’s second son, married Iva Bilić. They had sons Marijan and Mirko (1932–1936), who died as a young child, and daughters Joza (1922–) and Ana (1926–).","children":[{"code":"4.1.1.1.1.1","label":"Marijan, son of Jozo (1929–1977)","detail":"Marijan married Matija Mršić, and they had a son, Josip, and daughters Nada (1953–), Danica (1954–), Branka (1958–), Ana (1960–), Dragica (1964–) and Mirjana (1975–). Josip married Dragica Pavić. They have sons Marijan, Ante and Kristijan, and a daughter, Silvija.","children":[{"code":"4.1.1.1.1.1.1","label":"Josip, son of Marijan (1962–)","detail":"Josip married Dragica Pavić. They have sons Marijan (1991–), Ante (1996–) and Kristijan (1998–), and a daughter, Silvija (1994–). The family lives in Ričice.","children":[]}]}]},{"code":"4.1.1.1.2","label":"Ivan, son of Ivan (1903–1965)","detail":"He married twice. His first wife was Jaka Tavra, with whom he had sons Frane and Stanko (1938–1952), who died at the age of fourteen. He had no children in his second marriage to Ana Capia.","children":[{"code":"4.1.1.1.2.1","label":"Frane, son of Ivan (1933–)","detail":"Frane married Tomica Pavić, and they had sons Stanko, Cvjetko (1957–), Miroslav (1959–1959), who died as a young child, and Dragomir (1963–), and daughters Marija (1953–), Roza (1955–), Miroslava (1960–) and Anita (1971–). Stanko is married to Ankica Kovačević. They have daughters Tatjana and Tamara and live in Zagreb. Cvjetko and Dragomir never married. They live in Klokočevac near Bjelovar.","children":[{"code":"4.1.1.1.2.1.1","label":"Stanko, son of Frane (1956–)","detail":"Stanko married Ankica Kovačević, and they had daughters Tatjana (1981–) and Tamara (1983–). The family lives in Zagreb.","children":[]}]}]}]},{"code":"4.1.1.2","label":"Mate, son of Ante (1873–1927)","detail":"He married Ruža Manenica. They had sons Ante (1901–1901), Josip (1905–), Cvitan, another son also named Ante (1908–), and Nikola, and daughters Tomica (1902–) and Mara (1910–). No records concerning Josip have been found apart from his birth record. He may have died young or moved elsewhere.","children":[{"code":"4.1.1.2.1","label":"Cvitan, son of Mate (★ 1906 – ✝ 1981)","detail":"Cvitan, Mate’s third son, married Tomica Pavić. They had sons Mate (1932–1933), who died as a young child, and Nikola (1938–), and daughters Lucija (1930–), Ana (1934–1935), Ruža (1936–), Stana (1940–), Nevenka (1945–) and Branka (1947–). No records concerning Nikola have been found apart from his birth record. He may have died young or moved elsewhere. Cvitan’s line died out.","children":[]},{"code":"4.1.1.2.2","label":"Ante, son of Mate (1908–)","detail":"He married Ana Pavić. They had sons Marijan, Dinko (1937–1939), who died as a young child, Mirko, Mate and Cvitan, and daughters Ana (1935–), Mara (1939–) and Tonka (1950–).","children":[{"code":"4.1.1.2.2.1","label":"Marijan, son of Ante (1934–1963)","detail":"Marijan married Pava Pušić. They raised sons Ante and Dinko, and a daughter, Neda (1960–). Marijan was killed in Germany in 1963. The family lives in Klokočevac.","children":[{"code":"4.1.1.2.2.1.1","label":"Ante, son of Marijan (1961–1991)","detail":"Ante married Mirjana Čeh, and they had sons Marijan (1988–) and Marko (1990–). In the early 1990s, he joined the defence of Croatia against the aggression of the former Yugoslav People’s Army and Serbian paramilitary forces.\n\nHe served in the Croatian War of Independence from August 1991 as a member of the 105th Brigade of the Croatian Army. In September of that year, Ante and nineteen other Croatian defenders, mostly from Bjelovar, were captured in Kusonje near Pakrac, tortured and killed. Their remains were exhumed from the Rakov Potok mass grave in January 1992.","children":[]},{"code":"4.1.1.2.2.1.2","label":"Dinko, son of Marijan (1963–)","detail":"Dinko married Dubravka Lončar, and they had sons Luka (1987–) and Pavao (1988–). Dinko served as an assistant minister under Tomislav Medved. The family lives in Zagreb.","children":[]}]},{"code":"4.1.1.2.2.2","label":"Mirko, son of Ante (1942–)","detail":"He married Anđa Parlov, and they had sons Marijan (1965–) and Ivica. Marijan never married. Mirko, Anđa and Marijan live in Split.","children":[{"code":"4.1.1.2.2.2.1","label":"Ivica, son of Mirko (1969–)","detail":"Ivica married Matija Bilobrk. They have a son, Ivan (1992–), and a daughter, Ivana (1985–). They live in the United States.","children":[]}]},{"code":"4.1.1.2.2.3","label":"Cvitan, son of Ante (1945–)","detail":"He married Katica Kršinić. They have a son, Marijan, and a daughter, Zrinka (1973–). Cvitan’s family lives in Split.","children":[{"code":"4.1.1.2.2.3.1","label":"Marijan, son of Cvitan (★ 1970)","detail":"Marijan married Leida Kezele. They have sons Luka (1996–) and Lovro (1999–). The family lives in Split.","children":[]}]},{"code":"4.1.1.2.2.4","label":"Mate, son of Ante (1947–)","detail":"He married Zlata Mihoci. They raised a son, Dario, and a daughter, Danijela (1977–). The family lives in Split.","children":[{"code":"4.1.1.2.2.4.1","label":"Dario, son of Mate (1973–)","detail":"Dario is married to Ivana, née Tomić. They have six children; names, sexes and birth years will be added later.","children":[]}]}]},{"code":"4.1.1.2.3","label":"Nikola, son of Mate (1911–1980)","detail":"Nikola married Mara Brnas. They had sons Vinko and Ante and daughters Dragica, Tomica and Nediljka. Ante did not marry. The family lives in Ričice.","children":[{"code":"4.1.1.2.3.1","label":"Vinko, son of Nikola (★ 1947. – ✝ 2010.)","detail":"Vinko was married to Daniela Zaizer, with whom he had a son, Nikola David (1981–). No information is available as to whether Nikola David married or remained single.","children":[]}]}]}]}]}]}}</script>
